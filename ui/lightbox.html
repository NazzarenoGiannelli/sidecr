<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sidecr image</title>
  <style>
    html, body { height: 100%; margin: 0; background: #000; overflow: hidden; cursor: zoom-out; }
    #image { display: block; width: 100%; height: 100%; object-fit: contain; user-select: none; -webkit-user-drag: none; }
    #counter { position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); padding: 2px 10px; border-radius: 999px; background: #000a; color: #ddd; font: 12px/1.6 system-ui, "Segoe UI", sans-serif; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <img id="image" alt="">
  <div id="counter" hidden></div>
  <script src="/lightbox.js" type="module"></script>
</body>
</html>

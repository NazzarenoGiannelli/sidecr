name: Release

# A tag v* makes a GitHub release. There is nothing to publish to npm: herdr installs the plugin from this repository
# (`herdr plugin install NazzarenoGiannelli/sidecr --ref v0.1.0`), so the tag itself is what users get.
#
# The checks run first, with a read-only token; only the last job, which needs all of them to pass, may write.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest]
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile

      # The tag is the claim; these are the checks that the claim is true. herdr reads the version from the manifest,
      # the settings window from package.json, and the shell from Cargo.toml: all three must match the tag.
      - name: Tag matches the manifest, package.json and Cargo.toml
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(bun -e "console.log(require('./package.json').version)")
          MANIFEST=$(bun -e "console.log(Bun.TOML.parse(await Bun.file('herdr-plugin.toml').text()).version)")
          CARGO=$(bun -e "console.log(Bun.TOML.parse(await Bun.file('shell/src-tauri/Cargo.toml').text()).package.version)")
          for v in "$PKG" "$MANIFEST" "$CARGO"; do
            if [ "$TAG" != "$v" ]; then
              echo "tag v$TAG does not match package.json $PKG, herdr-plugin.toml $MANIFEST, Cargo.toml $CARGO" >&2
              exit 1
            fi
          done

      - name: Typecheck
        run: bun run typecheck

      - name: Tests
        run: bun test
        env:
          # Shared runners are slower than a developer machine: the performance budgets are multiplied by this.
          SIDECR_TEST_TIME_SCALE: "3"

      # The install runs these two build steps; a tag that does not build is not a release.
      - name: Build the window
        run: bun run build:ui

  shell:
    name: verify native shell (windows-latest)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: shell/src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: shell/src-tauri -> target
      - run: cargo check --locked
      - run: cargo test --locked

  release:
    needs: [verify, shell]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release, and nothing else
    steps:
      - uses: actions/checkout@v4

      # Notes come from the CHANGELOG section for this version, not from the commit list: the changelog says what
      # changed for a user, the commits say what changed in the code. Falls back to generated notes only if the
      # version has no section; a missing changelog entry should be visible, not papered over with commit subjects.
      - name: Release notes from CHANGELOG
        id: notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if awk -v v="## [$VERSION]" 'index($0, v)==1 {found=1; next} (/^## \[/ || /^\[[^]]+\]: /) && found {exit} found' CHANGELOG.md > "$RUNNER_TEMP/notes.md" && [ -s "$RUNNER_TEMP/notes.md" ]; then
            echo "have_notes=true" >> "$GITHUB_OUTPUT"
          else
            echo "have_notes=false" >> "$GITHUB_OUTPUT"
            echo "::warning::no CHANGELOG section for $VERSION, falling back to generated notes"
          fi

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          HAVE_NOTES: ${{ steps.notes.outputs.have_notes }}
        run: |
          # Idempotent: a release may already exist if it was cut by hand.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists, leaving it alone"
            exit 0
          fi
          if [ "$HAVE_NOTES" = "true" ]; then
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
          fi

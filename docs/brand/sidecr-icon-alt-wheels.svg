<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Sidecr">
  <rect width="512" height="512" rx="112" fill="#d9dad8"/>
  <!-- main pane: the terminal -->
  <rect x="58" y="128" width="268" height="236" rx="46" fill="#303438"/>

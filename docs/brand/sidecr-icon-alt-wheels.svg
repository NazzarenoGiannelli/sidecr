  <rect x="214" y="288" width="64" height="24" rx="12" fill="#d9dad8"/>
  <!-- coupling between the two -->
  <rect x="316" y="238" width="48" height="24" rx="12" fill="#303438"/>
  <!-- sidecar: the chat pod -->
  <rect x="350" y="170" width="112" height="170" rx="42" fill="#5347fd"/>
  <circle cx="380" cy="255" r="11" fill="#ffffff"/>
  <circle cx="406" cy="255" r="11" fill="#ffffff"/>
  <circle cx="432" cy="255" r="11" fill="#ffffff"/>
  <!-- wheels -->
  <circle cx="132" cy="388" r="32" fill="#303438" stroke="#d9dad8" stroke-width="12"/>
  <circle cx="262" cy="388" r="32" fill="#303438" stroke="#d9dad8" stroke-width="12"/>
  <circle cx="406" cy="364" r="26" fill="#5347fd" stroke="#d9dad8" stroke-width="12"/>
</svg>
